<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peter Pan Adventure Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Peter Pan Adventure Game</h1>

<div class="story">
  Peter Pan travels to London to bring Wendy, John, and Michael to Neverland.
  Explore forests, meet lost children, save Tiger Lily, and battle pirates!
</div>

<div class="game-container">
  <canvas id="gameCanvas" width="1000" height="500"></canvas>
</div>

<div class="controls">
  Move: ← → ↑ ↓ Arrow Keys
</div>

<script src="app.js"></script>

</body>
</html>
